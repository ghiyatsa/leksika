name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 54.255.48.119
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo git config --global --add safe.directory /home/admin/web/leksika.ghiyatsa.web.id/public_html
            cd /home/admin/web/leksika.ghiyatsa.web.id/public_html
            sudo -u admin git pull origin master
            sudo -u admin /usr/bin/composer install --no-dev --no-interaction
            npx --yes lightningcss-cli --minify public/css/style.css -o public/css/style.min.css
            npx --yes terser public/js/app.js -o public/js/app.min.js --compress --mangle
            sudo systemctl restart frankenphp-ci4.service
