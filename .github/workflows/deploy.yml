name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 54.255.48.119
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/admin/web/leksika.ghiyatsa.web.id/public_html
            git pull origin master
            composer install --no-dev --no-interaction
            sudo systemctl restart frankenphp-ci4.service
